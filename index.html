<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Educativo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        p {
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn {
            text-decoration: none;
            background: white;
            color: #0077ff;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            background: #0077ff;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎮 Jogo Educativo</h1>
        <p>Clique no botão abaixo para começar a jogar!</p>

        <a class="btn" href="Jogo educativo.html" onclick="entrarJogo()">
            Jogar Agora
        </a>
    </div>

    <script>
        function entrarJogo() {
            console.log("Entrando no jogo...");
        }
    </script>

</body>
</html>
