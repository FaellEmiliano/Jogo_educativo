<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo educativo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #f7f7f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      color: #cfcfcf;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 8px;
      background: #f7f7f7;
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #69c7ff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jogo educativo</h1>
    <p>Carregando o jogo...</p>
    <a href="./Jogo%20educativo.html">Iniciar jogo</a>
  </main>

  <script>
    window.location.replace("./Jogo%20educativo.html");
  </script>
</body>
</html>
